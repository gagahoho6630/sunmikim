<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiCo Group AI 프롬프트 라이브러리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F6;--card:#fff;--navy:#1A3D38;--muted:#5A7A75;--border:#D0E0DC;--rad:14px;--sha:0 2px 14px rgba(0,0,0,.07);--tr:.22s ease}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}
.view{display:none;min-height:100vh;animation:fi .2s ease}
.view.act{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* HEADER */
.hdr{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200}
.hdr-l{display:flex;align-items:center;gap:10px}
.hdr-logo-img{font-family:'Georgia',serif;font-size:22px;font-weight:900;font-style:italic;color:#fff;letter-spacing:.5px;line-height:1}
.hdr-logo-img em{font-style:italic;color:#2B9E8C;margin-left:3px}
.hdr-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.2px}
.hdr-sub{font-size:15px;opacity:.5;margin-top:1px}
.btn-adm{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 13px;border-radius:20px;font-size:16px;cursor:pointer;transition:var(--tr);font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.btn-adm:hover{background:rgba(255,255,255,.22)}

/* SEARCH */
.search-wrap{padding:0 18px 0;max-width:820px;margin:0 auto 0}
.search-box{display:flex;align-items:center;background:#fff;border:1.5px solid var(--border);border-radius:30px;padding:8px 16px;gap:8px;box-shadow:var(--sha);margin-bottom:16px}
.search-box input{flex:1;border:none;outline:none;font-size:17px;font-family:'Noto Sans KR',sans-serif;background:transparent;color:var(--navy)}
.search-box input::placeholder{color:var(--muted)}
.search-icon{font-size:18px;color:var(--muted)}
.search-results{display:none;background:#fff;border-radius:var(--rad);border:1px solid var(--border);box-shadow:var(--sha);max-height:340px;overflow-y:auto;margin-bottom:8px}
.sr-item{padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:var(--tr)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:#F0F9F7}
.sr-cat{font-size:14px;color:var(--muted);margin-bottom:2px}
.sr-name{font-size:17px;font-weight:700}
.sr-preview{font-size:15px;color:#666;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* MAIN HERO */
.main-wrap{padding:20px 18px;max-width:820px;margin:0 auto}
.hero{margin-bottom:26px}
.hero h1{font-family:'Outfit',sans-serif;font-size:32px;font-weight:800;line-height:1.18;letter-spacing:-.5px}
.hero h1 .hl{color:#D4923A}
.hero p{font-size:17px;color:var(--muted);margin-top:9px;line-height:1.7}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(min-width:560px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:820px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
.cat-card{background:var(--card);border-radius:var(--rad);padding:25px 22px;cursor:pointer;border:1.5px solid transparent;box-shadow:var(--sha);transition:all var(--tr);position:relative;overflow:hidden}
.cat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--cc)}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(0,0,0,.11);border-color:var(--cc)}
.cat-icon{font-size:42px;margin-bottom:13px;display:block;line-height:1}
.cat-name{font-size:24px;font-weight:700;line-height:1.35;color:var(--navy)}
.cat-cnt{font-size:21px;color:var(--muted);margin-top:7px}
.cat-cnt b{color:var(--cc);font-weight:700}

/* CAT PAGE */
.cat-hdr{background:var(--card);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.back{background:none;border:none;cursor:pointer;font-size:22px;color:var(--navy);line-height:1;padding:2px 4px}
.cat-hdr-title{font-size:19px;font-weight:700;flex:1}
.cat-hdr-cnt{font-size:15px;color:var(--muted);white-space:nowrap}
.cat-wrap{padding:20px 18px;max-width:820px;margin:0 auto;box-sizing:border-box;width:100%}

/* AI QUICK LINKS */
.ai-links-sec{margin-bottom:20px}
.sec-label{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:9px;font-weight:700}
.ai-links{display:flex;flex-wrap:wrap;gap:8px}
.ai-link{display:inline-flex;align-items:center;gap:5px;background:var(--navy);color:#fff;padding:7px 14px;border-radius:20px;font-size:16px;text-decoration:none;transition:var(--tr);font-family:'Noto Sans KR',sans-serif}
.ai-link:hover{opacity:.8}
.ai-link::after{content:'↗';font-size:14px;opacity:.7}

/* PROMPT SECTION */
.p-section{margin-bottom:28px}
.p-sec-title{font-size:18px;font-weight:700;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.p-sec-bar{display:inline-block;width:3px;height:16px;border-radius:2px;flex-shrink:0}
.p-card{background:var(--card);border-radius:var(--rad);border:1px solid var(--border);margin-bottom:11px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.p-head{padding:14px 16px 8px}
.p-body{padding:0 16px 14px}
.p-text{font-size:16px;line-height:1.75;color:#3a3a4e;background:#F8F7F4;border-radius:8px;padding:12px 13px;max-height:170px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;border:1px solid var(--border);font-family:'Noto Sans KR',sans-serif}
.p-foot{padding:0 16px 14px;display:flex;justify-content:flex-end}
.copy-btn{background:var(--navy);color:#fff;border:none;padding:7px 18px;border-radius:20px;font-size:16px;cursor:pointer;transition:var(--tr);display:inline-flex;align-items:center;gap:5px;font-family:'Noto Sans KR',sans-serif}
.copy-btn:hover{opacity:.8}
.copy-btn.ok{background:#2B9E8C}
.copy-btn .ic::before{content:'⎘'}
.copy-btn.ok .ic::before{content:'✓'}

/* ADMIN */
.adm-hdr{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.adm-hdr h2{font-family:'Outfit',sans-serif;font-size:21px;font-weight:700;display:flex;align-items:center;gap:8px}
.adm-hdr button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:20px;font-size:16px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.adm-wrap{padding:20px 18px;max-width:760px;margin:0 auto}
.a-sec{background:var(--card);border-radius:var(--rad);padding:20px;margin-bottom:16px;border:1px solid var(--border)}
.a-sec-title{font-size:19px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;font-size:15px;padding:2px 9px;border-radius:12px;font-weight:600}
.badge-sec{background:#FEF3C7;color:#92400E}
.badge-data{background:#E0F5F0;color:#1A3D38}
.fg{margin-bottom:13px}
.fg label{font-size:16px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px}
.fi{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:18px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:var(--tr);background:var(--bg)}
.fi:focus{border-color:var(--navy);background:#fff}
textarea.fi{min-height:100px;resize:vertical;line-height:1.6}
.btn{border:none;padding:9px 18px;border-radius:8px;font-size:17px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:600;transition:var(--tr)}
.btn-p{background:var(--navy);color:#fff}
.btn-p:hover{opacity:.85}
.btn-d{background:#FEE2E2;color:#B91C1C}
.btn-d:hover{background:#FECACA}
.btn-w{background:#FEF3C7;color:#92400E}
.btn-sm{padding:5px 12px;font-size:16px;border-radius:6px}
.fr{display:flex;gap:8px;flex-wrap:wrap}
.a-cat-list{margin-top:12px}
.a-cat-item{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:visible}
.a-cat-h{padding:11px 14px;background:#F9F8F5;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-radius:10px}
.a-cat-nm{font-size:18px;font-weight:700}
.a-cat-actions{display:flex;gap:6px;align-items:center}
.a-prompt-list{padding:10px 12px;border-top:1px solid var(--border);background:#fff;border-radius:0 0 10px 10px;display:none}
.a-p-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);margin-bottom:7px;background:#FDFCFA}
.a-p-info{flex:1;min-width:0}
.a-p-nm{font-size:17px;font-weight:700}
.a-p-pre{font-size:15px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.a-p-acts{display:flex;gap:5px;flex-shrink:0}
.inline-form{background:#F0EDE8;border-radius:8px;padding:13px;margin-bottom:7px;border:1.5px solid #D0CCC5}
.inline-form-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:10px}
.add-prompt-form{background:#E8F5F0;border-radius:8px;padding:13px;margin-top:8px;border:1.5px solid #B8DEC7;display:none}
.add-cat-form{display:none;background:#E0F5F0;border-radius:8px;padding:13px;margin-bottom:14px;border:1.5px solid #B8DEC7}

/* MODALS */
.mb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:1000;justify-content:center;align-items:center;padding:20px}
.mb.open{display:flex}
.modal{background:var(--card);border-radius:18px;padding:26px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:22px;font-weight:700;margin-bottom:5px}
.modal p{font-size:17px;color:var(--muted);margin-bottom:18px}
.modal-btns{display:flex;gap:9px;margin-top:18px}
.modal-btns .btn{flex:1;padding:11px}
.pw-in{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px;font-size:22px;letter-spacing:5px;text-align:center;font-family:'Outfit',sans-serif;outline:none;transition:var(--tr)}
.pw-in:focus{border-color:var(--navy)}
.pw-err{color:#D4923A;font-size:16px;margin-top:7px;min-height:17px;text-align:center}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:11px 22px;border-radius:30px;font-size:17px;z-index:9999;pointer-events:none;transition:transform .3s ease;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

hr.div{border:none;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>
<body>

<!-- 메인 뷰 -->
<div id="v-main" class="view act">
  <header class="hdr">
    <div class="hdr-l">
      <span class="hdr-logo-img">MiCo<em>Group</em></span>
      <div>
        <div class="hdr-title">MiCo Group AI 활용법 교육</div>
        <div class="hdr-sub">프롬프트 라이브러리 · 총 54개 · 8개 카테고리</div>
      </div>
    </div>
    <button class="btn-adm" onclick="openPwModal()">🔐 관리자</button>
  </header>

  <!-- 검색 -->
  <div class="search-wrap" style="padding-top:18px">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="프롬프트 검색..." oninput="onSearch(this.value)">
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <div class="main-wrap">
    <div class="hero">
      <h1>MiCo Group<br><span class="hl">AI 활용법</span> 교육</h1>
      <p>원하는 카테고리를 선택하면 프롬프트를 확인하고 바로 복사할 수 있습니다. (총 54개 프롬프트 · 8개 카테고리)</p>
    </div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>
</div>

<!-- 카테고리 상세 뷰 -->
<div id="v-cat" class="view">
  <div class="cat-hdr">
    <button class="back" onclick="showMain()">←</button>
    <span class="cat-hdr-title" id="cat-hdr-title"></span>
    <span class="cat-hdr-cnt" id="cat-hdr-cnt"></span>
  </div>
  <div class="cat-wrap" id="cat-wrap"></div>
</div>

<!-- 관리자 뷰 -->
<div id="v-admin" class="view">
  <div class="adm-hdr">
    <h2>⚙️ 관리자 모드</h2>
    <button onclick="showMain()">← 홈으로</button>
  </div>
  <div class="adm-wrap">
    <div class="a-sec">
      <div class="a-sec-title">📂 카테고리 &amp; 프롬프트 관리 <span class="badge badge-sec">편집</span></div>
      <div class="fr" style="margin-bottom:14px">
        <button class="btn btn-p btn-sm" onclick="toggleAddCatForm()">+ 카테고리 추가</button>
        <button class="btn btn-w btn-sm" onclick="saveHtml()">💾 HTML 저장</button>
      </div>
      <div class="add-cat-form" id="add-cat-form">
        <div class="inline-form-title">새 카테고리 추가</div>
        <div class="fg"><label>카테고리 이름</label><input class="fi" id="new-cat-name" placeholder="예: 10. 신규 카테고리"></div>
        <div class="fr">
          <button class="btn btn-p btn-sm" onclick="addCategory()">추가</button>
          <button class="btn btn-sm" onclick="toggleAddCatForm()">취소</button>
        </div>
      </div>
      <div class="a-cat-list" id="a-cat-list"></div>
    </div>
    <div class="a-sec">
      <div class="a-sec-title">🔐 보안 <span class="badge badge-sec">설정</span></div>
      <div class="fg"><label>관리자 비밀번호 변경</label>
        <input class="fi" type="password" id="pw-cur" placeholder="현재 비밀번호" style="margin-bottom:8px">
        <input class="fi" type="password" id="pw-new1" placeholder="새 비밀번호">
        <input class="fi" type="password" id="pw-new2" placeholder="새 비밀번호 확인" style="margin-top:8px">
      </div>
      <button class="btn btn-p btn-sm" onclick="changePw()">비밀번호 변경</button>
    </div>
  </div>
</div>

<!-- 비밀번호 모달 -->
<div class="mb" id="mb-pw">
  <div class="modal">
    <h3>🔐 관리자 인증</h3>
    <p>비밀번호를 입력하세요</p>
    <input class="pw-in" type="password" id="pw-input" maxlength="20" oninput="pwErr('')" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="pw-err" id="pw-err"></div>
    <div class="modal-btns">
      <button class="btn btn-p" onclick="checkPw()">확인</button>
      <button class="btn" onclick="closePwModal()">취소</button>
    </div>
  </div>
</div>

<!-- 확인 모달 -->
<div class="mb" id="mb-confirm">
  <div class="modal">
    <h3 id="confirm-title">삭제할까요?</h3>
    <p id="confirm-msg">이 작업은 되돌릴 수 없습니다.</p>
    <div class="modal-btns">
      <button class="btn btn-d" id="confirm-ok">삭제</button>
      <button class="btn" onclick="closeConfirm()">취소</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── 데이터 ──
var data_json = {"1. 글쓰기": [{"name": "아이를 위한 동화", "content": "6세 아이를 위한 짧은 동화를 써 주세요. \n주인공은 [채리나]라는 [6살 한국 여자] 아이와 겁이 많지만 용기를 배우는 [아기 고양이 ‘가을이’]예요. \n이야기 주제는 [편식을 하지 말아요]이고,  마지막에 따뜻한 교훈이 담겨 있어야 해요. \n\n아이가 이해할 수 있는 쉬운 말로 쓰고, 10문단 정도로 해 주세요."}, {"name": "어른을 위한 생각하는 동화", "content": "어른들을 위한 짧은 철학적 동화를 써 주세요.\n이솝 우화처럼 동물에 비유해 주세요.\n주제는 '갈등이 조직전체를 망친다'이며,\n주인공들은 토끼, 호랑이, 여우, 까치, 까마귀입니다.\n문장은 간결하고 상징적으로 써 주세요.\n분량은 10문단 이내이며, 독자가 생각에 잠기도록 열린 결말로 마무리해 주세요."}], "2. AI로 음악만들기": [{"name": "음악만들기", "content": "MiCo Group의 직원 '       님'이  AI 교육을 받고 있어.\nAI활용 능력을 키워서, 회사와 국가의 경쟁력을 높이기 위한 이분의 노력을 격려하는 응원곡을 만들어 줘.\n이름을 많이 반복해줘.\n여성보컬이 노래하는 '하드락'으로 만들어 줘"}, {"name": "우리 부서 부팅 송", "content": "MiCo Group의 활기찬 아침을 여는 에너제틱한 K-Pop 댄스곡.\n'고객 감동'과 '최고의 기술력'을 위해 달리는 우리 팀원들을 찬양하는 가사.\n중독성 있는 후렴구와 강렬한 신스 사운드, 파워풀한 여성 보컬."}, {"name": "신규 프로젝트 CM송", "content": "MiCo Group의 혁신적인 신규 프로젝트를 홍보하는 세련된 시티팝(City Pop).\n'미래를 연결하는 기술', '스마트 솔루션'이라는 키워드를 강조.\n맑고 청아한 보컬, 부드러운 그루브, 트렌디한 카페 라운지 분위기."}, {"name": "보안 규정 가이드송", "content": "사내 보안 수칙을 쉽게 외울 수 있게 돕는 밝고 경쾌한 어쿠스틱 포크(Acoustic Folk).\n'비밀번호 변경', '로그아웃' 등 필수 업무 수칙 가사를 담음.\n따뜻한 남성 보컬, 통기타 반주, 누구나 따라 부르기 쉬운 멜로디."}, {"name": "동료 감사·헌정곡", "content": "프로젝트를 성공적으로 마친 동료들을 향한 고마움을 담은 감성적인 R&B 발라드.\n'함께 밤샘한 열정', '든든한 파트너'라는 내용을 담아 진심을 전달.\n호소력 짙은 보컬, 피아노와 스트링 편곡, 감동적인 분위기."}], "3. Nano Banana 활용": [{"name": "위험성평가표 작성", "content": "첨부한 이미지를 분석해서, 현장안전 위험요소가 있는지 점검하고, 상세 위험성평가표 작성."}, {"name": "안전교육자료 작성", "content": "이 현장에 공사로 참여하는 직원에게 안전교육을 위한 4컷 웹툰 만들어줘.\n그림은 {레고} 스타일."}, {"name": "캘리그라피 - 변형 1/3", "content": "사용 문구: {너의 새로운 시작을 응원해!}\n\n[프롬프트]\n흰 배경 위 손그림 그래픽 포스터, \n파스텔 핑크와 메탈릭 실버 전용.\n —ar 4:5 \"{}\" 문구의 두툼한 버블검 핑크 스트리트 레터링. \n마커와 브러시 질감이 살아있는 거칠고 묵직한 손그림 스타일.\n불규칙한 크기의 탄력 있는 리듬감. \n바깥으로 돌출되는 강한 핀쿠션 왜곡과 테두리가 흔들리는 '스퀴글비전(squigglevision)' 효과. \n글자를 감싸며 연결하는 마커 스타일의 가느다란 핑크 발레코어 리본. \n사이사이에 배치된 스케치 질감의 메탈릭 실버 별, 반짝임, 작은 구슬 장식."}, {"name": "캘리그라피 - 변형 2/3", "content": "사용 문구: {손글씨가 필요하면 날 불러}\n\n[프롬프트]\n흰 배경 위 보라색과 흰색 전용 디지털 손그림, \n아이패드 브러시 질감. \n—ar 4:5 \"{}\" 문구의 거대하고 두툼한 헤비웨이트 핸드 레터링.\n필압이 느껴지는 부드럽고 묵직한 디지털 브러시 채움. 불규칙한 크기의 역동적인 스케치북 리듬.\n바깥으로 부풀어 오른 강한 핀쿠션 왜곡. \n테두리가 흔들리는 스퀴글비전(squigglevision) 효과와 기울어진 이탤릭체. \n글자 사이 숨겨진 얼굴들. \n화살표, 왕관, 번개, 페인트 비산, 별, 미소 아이콘이 연결된 보라색 디지털 낙서와 귀여운 스티커 스타일."}, {"name": "캘리그라피 - 변형 3/3", "content": "서체와 로고를 최대한 유지하면서 로고의 글씨를 바꿔줘.\n변경 후 : 너도 할 수 있어"}, {"name": "가우디풍 광화문", "content": "\"서울의 맑고 푸른 하늘 아래 웅장하게 서 있는 '광화문' 광장. 전통적인 기와지붕과 화강암 성벽으로 이루어진 거대한 문이 있는데, 그 건축물의 기둥과 지붕 라인이 모여서 거대한 한글 '광화문' 세 글자 형상화하고 있어. 인위적인 글씨가 아니라, 마치 건축가 가우디가 설계한 것처럼 자연스럽게 글자 모양을 이루는 초현실적인 건축 사진.\""}, {"name": "뿌리 깊은 나무", "content": "\"오래된 한국의 소나무(Pine tree) 숲속 클로즈업 사진. \n거친 소나무 껍질과 굵은 나무 기둥들이 얽혀서\n '뿌리 깊은 나무'라는 한글 문장을 입체적으로 형성하고 있어. \n송진, 이끼, 나무 결의 질감이 글자 획에 그대로 살아있는 극도로 사실적인 표현.\""}, {"name": "소리가 보이는 그림", "content": "아래 한글 단어의 소리와 의미를 시각적인 형태와 질감으로 표현한 역동적인 타이포그래피 스티커 세트 그려줘. 흰색 배경. \n\"사랑해, 고마워, 미안해, 위험해, 미끄러워, 짜증나\""}, {"name": "포스터 제작", "content": "회사내 PC사용자의 정보보안의식강화를 홍보하는 포스터를 그려줘. \n경각심을 높일수 있는 분위기로 그려줘."}, {"name": "픽토그램 그리기", "content": "너는 픽토그램 제작 전문가야.\n '보행중 휴대폰 사용금지' 픽토그램을 칼라로 그려줘"}, {"name": "분해도 제작", "content": "“자동차헤드라이트를 3D로 분해한 이미지 만들어줘 . 부품 명칭도 기재해 줘"}, {"name": "인물합성", "content": "이 사진의 사람과 페이커가 같이 에펠탑 앞에서 닭발을 안주로 소주마시는 사진 만들어줘.\""}, {"name": "캘리그라피 수정", "content": "서체와 로고를 최대한 유지하면서 로고의 글씨를 바꿔줘.\n변경 후 : 너도 할 수 있어"}, {"name": "증명사진만들기", "content": "이 사진을 정장을 입은 전문적인 프로필 사진으로 바꿔줘.\n 원본 사진에 나타난 피사체의 원래 얼굴 특징, 정체성, 비례, 표정은 100% 보존해야 합니다. 얼굴은 어떤 식으로든 변경하지 말고, 오직 의상, 배경, 스타일링만 깔끔하고 전문적인 프로필 사진에 맞게 조정해 주세요"}, {"name": "셀카로 3D 캐릭터 제작", "content": "첨부한 이미지를 {편안한 이웃주민, 동네에서 흔히 만날 수 있는 인물}로 표현해줘.\n꾸밈이 없음, 만화캐릭터 포즈의 전신샷.\n3D 애니메이션에서 바로 튀어 나온 것 같은 Chibi 스타일. \n배경 순백색."}, {"name": "치비스타일 스노우볼", "content": "첨부된 사진 속 인물을 귀여운 치비 스타일로 파스텔 톤의 크리스탈 스노우볼 안에 배치했습니다.\n이 피규어는 픽셀 하트, 작은 별, 게임 아이콘으로 장식된 작은 잔디 언덕 위에 서 있어, 장난기 넘치는 게임 테마의 분위기를 자아냅니다.\n캐릭터의 크고 반짝이는 눈은 은은한 홍조와 옅은 미소를 띠고 있어 사랑스럽고 생동감 넘치는 느낌을 더합니다.\n모든 소재는 무광 마감의 부드러운 폴리머 클레이 소재로 제작되었습니다.\n스노우볼은 심플한 파스텔톤 베이스 위에 놓여 있으며, 스튜디오급의 부드러운 조명을 사용합니다.\n형식: 1:1."}, {"name": "3D 캐릭터로 카카오톡 이모티콘 제작", "content": "역할: 카카오톡 상업용 이모티콘 크리에이터\n목표: 첨부된 캐릭터의 외형(Chibi 스타일, 의상, 이목구비)을 완벽히 유지하여 5x4 그리드(총 20종), 흰색 배경의 이모티콘 가로 와이드 시트 제작.\n\n[필수 제작 가이드]\n캐릭터 일관성: 참조 이미지의 3D 질감, 비율, 착장을 모든 컷에 동일 적용.\n\n20종 구성 (중복 금지)\n감정(6): 기쁨, 슬픔, 화남, 놀람, 애교, 당황\n일상(6): 피곤, 출근, 격려, 축하, 포기, 공감\n밈/텍스트(8): 헐, 인정, 퇴근, 뭐래, ㄱㄱ, 굿 등 한국어 표현\n\n디자인/텍스트\n텍스트: 2~5자의 짧은 한국어(속어, 감탄사)를 친근한 손글씨체로 작성(말풍선 활용).\n스타일: 모바일 최적화(손글씨체), 생동감 있는 포즈.\n\n출력: 위 가이드를 준수하여 상세한 묘사의 고해상도 20종 이모티콘 시트를 생성하세요."}, {"name": "셀카로 프사 이미지 제작", "content": "\"피사체 얼굴 일관성 유지. \n프로필 전신샷. 얼굴을 환하게 밝히는 조명을 받고,\n피사체의 얼굴은 카메라를 정면으로 응시한다.\n피사체는 전문 메이크업아티스트와 헤어디자이너의 손길을 받았다.\n피사체는 계절에 어울리는 유명 패션디자이너의 명품 옷과 악세사리, 신발을 착용한다.\n{우유니사막} 한가운데, {노을이 지고} 있다.\n{치타}가 주인을 바라보며 앉아있다.\n피사체는 {치타}와 연결된 목줄을 잡고 있다.\n카메라 소니 a7으로 촬영. {9:16}비율.\""}, {"name": "Text to InfoGraphic", "content": "아래 내용을 정리하여 한 장의 인포그래픽으로 그려줘.\n'''\nMiCo의 강점 4가지\n1.고순도 세라믹 소재 기술력\n극한 공정 환경에서 사용 가능한 고순도 알루미나 세라믹 기술 보유\n불순물 관리 및 내식성 등 높은 진입장벽 \n\n2.소모품 구조 기반 반복 매출\n세라믹 부품은 마모되어 정기 교체 필요\n장비 가동 시 지속적인 수요 발생 \n\n3.소재 국산화 및 공급망 포지션\n국내 반도체 공급망 내 핵심 부품 업체\n공급망 진입 시 교체 어려운 구조 \n\n4.사업 포트폴리오 확장\n미코세라믹스: 연료전지\n미코바이오메드: 진단 사업\n반도체 외 신성장 동력 확보 시도"}, {"name": "Image to InfoGraphic", "content": "이 이미지의 내용을 16:9 비율의 인포그래픽으로 그려줘"}, {"name": "Youtube 2 infographic", "content": "https://www.youtube.com/watch?v=F13IRvz2-5Y\n이 영상의 내용을 16:9 비율의 인포그래픽으로 그려줘."}], "4. GEM 만들기": [{"name": "GEM 만들기", "content": "1. 역할 설정\n'너는 사용자가 원하는 결과물을 설명하면, 가장 적합한 AI 도구 3가지를 추천해 주는 AI 전문가야. 단순한 AI 추천을 넘어, 사용자가 바로 실행에 옮길 수 있도록 구체적인 정보를 제공해야 해.'\n2. 지침\n2.1 한국어 서비스가 가능한 AI 우선 추천\n2.2 한국인 사용자를 기준으로 추천\n3. 출력 형식 지정: '답변은 반드시 아래와 같은 형식으로 출력해 줘.'\n3.1 추천 AI: AI 도구의 이름\n3.2 홈페이지 주소: 해당 AI의 공식 홈페이지 URL\n3.3 간단한 사용법: AI를 활용해 사용자의 목표를 달성하는 구체적인 방법. 2~3가지 핵심 단계로 간결하게 설명할 것."}, {"name": "GEM TRIZ 해결안 도출기", "content": "#역할 및 임무\n너는 기업조직에서 발생하는 문제상황에 대한 해결책을 제안하는 전문가야. TRIZ의 40가지 발명원리를 적용해 해법을 제시하는 게 목표야.\n\n# 지침\n1. 사용자에게 먼저 '회사명과 문제가 발생한 부서명'을 입력해 달라고 요청해.\n2. 부서명과 회사명을 확인한 후 '문제점'을 입력해 달라고 요청해. 문제점은 TRIZ의 모순기법을 적용하여 입력하도록 예를 제시하며 질문해.\n3. 이 문제를 해결하기 위한 아이디어를 'TRIZ 40가지 발명원리중 가장 적합한 원리'를 적용하여, 아이디어 10개를 제시해.\n4. 추가적인 해법을 '10개 더 제시'할 지 물어본 후 없다면 '원활한 해결을 기원한다'는 격려 메시지를 표현해"}, {"name": "우리부서 Gem 자동화 - 변형 1/4", "content": "[        ]사 [          ]부서의 핵심적인 업무 20가지를 제시해 줘."}, {"name": "우리부서 Gem 자동화 - 변형 2/4", "content": "Gemini Gem로 자동화할 경우 업무 효율이 대폭 향상될 만한 업무 10가지를 추천해 줘."}, {"name": "우리부서 Gem 자동화 - 변형 3/4", "content": "'10개 Gem별 핵심 지시문 가이드'를 'Gem이름, 용도, 기대효과, 해당 업무수행을 위해 투입해야 할(Input해야 할) 자료나 정보, 해당 업무의 수행절차 (Processing) 3~7단계 구분, 출력물의 종류와 적합한 출력형태(Output)' 순으로 제시해줘"}, {"name": "우리부서 Gem 자동화 - 변형 4/4", "content": "너는 프롬프트 엔지니어야. [  ]번 업무를 Gemini Gem을 이용해 자동화 하고 싶어. 위에 도출된 '업무별 핵심 지시문 가이드'를 참조하여 Gemini Gem 제작을 위한 프롬프트 작성해 줘."}], "5. 바이브 코딩": [{"name": "게임 만들기", "content": "너는 게임개발자야. 너의 임무는 안드로이드 폰에서 구동되는 'HTML, CSS, JavaScript를 사용'해서 '테트리스 게임'을 만드는 거야. 설명은 최소화하고 전체 코드를 하나로 만들어 제공해줘."}, {"name": "모니터링 만들기", "content": "아래 프롬프트를 활용하여 안드로이드폰에서 작동되는 웹앱을 개발해 주세요.\n너의 임무는 'HTML, CSS, JavaScript를 사용'해서, 안드로이드 폰에서 구동되는 'MiCo Group 안전관리 AI 뉴스 모니터링 자동화 도구'를 만드는 것입니다. 설명은 최소화하고 전체 코드를 하나로 만들어 제공해 주세요.\n역할  \n당신은 웹개발 전문가이자 산업안전 데이터 분석 전문가입니다.  \n당신의 역할은 **\"MiCo Group의 안전관리 담당자가 산업재해, 법규 변화, 기술 동향 등 다양한 안전 리스크를 신속하게 파악하고 대응할 수 있도록 지원하는 AI 기반 뉴스 모니터링 웹앱을 개발하는 것\"**입니다.  \n목표는 MiCo Group 및 관련 산업군에서 발생하는 최신 산업안전 뉴스를 수집·분류·정리하고, 각 뉴스별로 '리스크 영향 분석'과 '대응 전략'을 제안하여, 안전관리 의사결정과 현장 대응에 실질적으로 활용 가능한 웹 시스템을 안드로이드 폰에서 작동되도록 구축하는 것입니다.  \n임무  \n아래 기능을 수행하는 웹을 안드로이드 폰에서 작동되게 개발하세요.  \n1.1. 검색 기간 설정 기능  \n사용자가 조회 기간을 선택할 수 있도록 합니다.  \n버튼 옵션: 최근 1일, 최근 1주, 최근 15일, 최근 1개월, 직접입력(사용자 지정)  \n1.2. 뉴스 수집 및 자동 분류 기능  \n선택된 기간 내 산업안전 관련 뉴스를 수집하여 다음 기준으로 자동 분류합니다.  \n- 중대재해 / 산업재해 (사망·중상 사고, 화재·폭발, 건설·제조·물류 재해 등)  \n- 법규 / 제도 변화 (산업안전보건법, 중대재해처벌법, 행정지침, 제재 강화 등)  \n- 업종별 안전이슈 (제조, 건설, 물류, 설비, 협력사 등 MiCo Group 관련 산업군 중심)  \n- 안전기술 / 예방 혁신 (스마트 안전장비, 자동화, AI 기반 위험예측 등)  \n- 조직문화 / 사회적 안전환경 (안전문화, 근로자 인식, 외국인 근로자, 고령화 등)  \n1.3. 뉴스별 상세 정리 항목  \n각 뉴스별로 아래 항목을 카드형 또는 표 형식으로 정리합니다.  \n- 제목  \n- 날짜  \n- 출처 (언론사 또는 기관)  \n- 요약 (3~4문장)  \n- MiCo Group 안전리스크 시사점 (당사 사업장 및 협력사에 미치는 영향 분석)  \n- 대응전략 제안 (실행 가능한 조치: 점검 강화, 교육 개선, 기술 도입, 프로세스 개선 등)  \n1.4. 뉴스 초기화 기능  \n\"초기화 버튼\" 클릭 시 조회된 모든 뉴스 데이터를 삭제하도록 구현합니다.  \n지침  \n- 반드시 선택된 기간 내 뉴스만 제공할 것  \n- 출력은 카드형 또는 표 형식으로 구성  \n- 광고, 연예, 스포츠, 단순 사회 기사 제외  \n- 모든 결과는 한국어로 작성  \n- 정확성, 최신성, 실효성을 최우선으로 고려  \n- 대응전략은 MiCo Group의 안전관리, 기술, 교육, 협력사 관리와 직접 연계 가능해야 함  \n- 재해 발생 시 사업장 유형(제조공장, 협력사, 물류센터, 건설현장 등), 재해 유형, 피해 규모 명시  \n- 향후 내부 보고서 연계 기능 고려 (예: 사고 유형별 통계, 주간 브리핑 PDF 생성 등)  \n📘 예시 출력  \n카테고리: 중대재해 / 산업재해  \n제목: 협력업체 설비 점검 중 폭발사고, 1명 중상  \n날짜: 2025-11-03  \n출처: ○○일보  \n요약: 설비 내부 잔류가스가 제거되지 않은 상태에서 점검 작업이 진행되어 폭발 사고가 발생했습니다. 안전작업허가 절차 미준수가 주요 원인으로 지목됩니다.  \nMiCo Group 안전리스크 시사점: 협력사 설비 점검 및 가스 관련 작업 시 안전관리 절차 강화 필요.  \n대응전략 제안:  \n- 고위험 작업 전 안전점검 체크리스트 의무화  \n- 잔류가스 측정 프로세스 강화 및 장비 도입  \n- 협력사 대상 정기 안전교육 확대  \n- 작업허가제 이행 여부 주기적 점검  \n카테고리: 법규 / 제도 변화  \n제목: 산업안전보건법 개정, 위험성 평가 의무 강화  \n날짜: 2025-11-02  \n출처: 고용노동부  \n요약: 산업안전보건법 개정으로 사업장의 위험성 평가 실시 및 기록 관리 의무가 강화되었습니다.  \nMiCo Group 안전리스크 시사점: 전 사업장 위험성 평가 체계 재정비 필요.  \n대응전략 제안:  \n- 위험성 평가 프로세스 표준화  \n- 평가 결과 디지털 관리 시스템 구축  \n- 관리자 및 실무자 대상 법규 교육 실시"}, {"name": "MBTI 진단기 개발", "content": "12개  질문을 활용해 MBTI 진단을 할 수 있는 간단한 MBTI 진단 웹앱을  (HTML + CSS + JS)를 사용해서 개발해 줘.  진단결과에 'MBTI 유형' 과 '장점, 단점'  정보를 포함해 줘."}, {"name": "웹앱자동화 - 변형 1/4", "content": "[        ]사 [          ]부서의 핵심적인 업무 20가지를 제시해 줘."}, {"name": "웹앱자동화 - 변형 2/4", "content": "위 업무중 Vibe Coding을 통해 웹앱을 만들어 업무를 자동화할 경우, 업무 효율이 대폭 향상될 만한 업무 10가지를 추천해 줘."}, {"name": "웹앱자동화 - 변형 3/4", "content": "'10개 업무별 핵심 지시문 가이드'를 '웹앱이름, 용도, 기대효과, 해당 업무수행을 위해 투입해야 할(Input해야 할) 자료나 정보, 해당 업무의 수행절차 (Processing) 3~7단계 구분, 출력물의 종류와 적합한 출력형태(Output)' 순으로 제시해줘"}, {"name": "웹앱자동화 - 변형 4/4", "content": "너는 프롬프트 엔지니어야.\n[ 1 ]번 업무를 웹앱을 이용해 자동화 하고 싶어.\n위에 도출된 '업무별 핵심 지시문 가이드'를 참조하여 '웹앱 제작을 위한 프롬프트' 작성해 줘."}], "6. AI Slides": [{"name": "기본 프롬프트", "content": "총 페이지수, 16:9 가로비율, 개조식 적용, 인포그래픽 적용, Font 지정, font Size (11 이상) 지정, 스타일 요청(흰색 배경)"}, {"name": "주  전문적, 객관적, 설득적, 친근함 등)\n\n## A — Audience\n대상 독자를 최대한 구체적으로 정의\n\n## R — Response Format\n출력 구조를 엄격하게 정의\n\n반드시 포함:\n- 섹션 구조\n- 길이 기준\n- 표/리스트 사용 여부\n- 필수 포함 요소\n- 제외 요소\n---\n\n\n# STEP 3 — PLAN-AND-SOLVE (PS+)\n답변 생성 전에 반드시 계획 단계를 수행하십시오.\n\n## Phase A — Variable Extraction\n다음을 먼저 추출:\n- 핵심 개념\n- 제약 조건\n- 성공 기준\n- 필요한 데이터\n- 잠재 리스크\n- 우선순위 요소\n\n## Phase B — Roadmap Design\n해결 순서를 단계별로 설계하십시오.\n각 단계마다:\n- 목적\n- 수행 작업\n- 기대 결과\n- 검증 포인트\n를 포함하십시오.\n\n## Phase C — Execution\n수립한 계획에 따라 단계적으로 실행하십시오.\n주의:\n내부 상세 추론 전체를 노출하지 말고,핵심 판단 근거와 요약된 사고 흐름만 제시하십시오.\n---\n# STEP 4 — SYSTEM 2 THINKING\n반드시 느린 사고 기반 검증 프로세스를 수행하십시오.\n## 검증 항목\n- 논리적 일관성\n- 근거 충분성\n- 목표 적합성\n- Audience 적합성\n- 실행 가능성\n- 누락 여부\n- 충돌 여부\n- 편향 가능성\n- 구조 완결성\n\n단순 직관적 생성에 의존하지 마십시오.\n가능한 대안들을 비교 검토한 뒤,가장 타당한 결론을 선택하십시오.\n---\n\n# STEP 5 — SELF-REFINE LOOP\n다음 3단계를 내부적으로 수행하십시오.\n\n## Phase 1 — Writer\n초안 생성\n\n수행:\n- 아이디어 확장\n- 다양한 접근 탐색\n- 논리 구조 설계\n- 근거 구성\n---\n\n## Phase 2 — Critic\n초안을 비판적으로 검토\n검토 기준:\n- 논리 비약\n- 정보 누락\n- 구조 문제\n- 실행 가능성 부족\n- 목표 불일치\n- Audience 부적합\n- 불필요한 장황함\n---\n\n## Phase 3 — Refiner\n비판 결과를 반영하여 개선\n규칙:\n- 문제 발견 시 자동 수정\n- 품질 미달 시 최대 3회 반복 개선\n- 최종본만 출력\n---\n# FAILURE PREVENTION RULES\n다음 문제 발견 시 즉시 수정 루프를 실행하십시오.\n- 목표 불명확\n- Audience 정의 부족\n- 출력 형식 누락\n- 논리 충돌\n- 실행 불가능성\n- 근거 부족\n- 요청 조건 누락\n- 구조 불완전\n---\n\n# PRIORITY RULES\n\n충돌 발생 시 우선순위:\n1. Objective\n2. Audience\n3. Accuracy\n4. Response Format\n5. Style\n6. Tone\n---\n# OUTPUT FORMAT\n반드시 아래 형식으로 출력하십시오.\n# 📊 프롬프트 설계 분석\n- 요청 복잡도:\n- 핵심 목표:\n- 대상 독자:\n- 제약 조건:\n- 성공 기준:\n- 추천 전략:\n---\n# 🧠 최적화된 프롬프트\n(최종 프롬프트 출력)\n---\n# 🔍 품질 검증 요약\n- 논리 검증 결과:\n- 누락 검토 결과:\n- 실행 가능성:\n- 최종 개선 여부:"}], "8. 보고서 작성": [{"name": "보고서 프롬프트 생성", "content": "다음 조건을 지켜줘.\n1. 너는 전략수립 전문가야.\n2. 'CEO께 보고할 보고서 작성'용 프롬프트를 작성하는게 임무야.\n3. 답변은 서술형으로 작성해.\n,,,\n'[   ] 사의 [2026년 HRD 운영전략 보고서]'작성을 위한 프롬프트 작성해 줘."}, {"name": "전략보고서 작성", "content": "아래 프롬프트를 기준으로 'CEO 보고용 전략보고서' 작성해 줘."}, {"name": "슬라이드 작성", "content": "#역할: 나는 슬라이드 디자인 전문가야.\n#임무:   if(nm.includes('마케팅') || nm.includes('홍보')) return {icon:'📣', color:'#E11D48'};
  if(nm.includes('교육') || nm.includes('강의') || nm.includes('학습')) return {icon:'🎓', color:'#8B5CF6'};
  if(nm.includes('ai') || nm.includes('프롬프트') || nm.includes('gpt') || nm.includes('basic')) return {icon:'🤖', color:'#D4923A'};
  if(nm.includes('gem') || nm.includes('notebook')) return {icon:'💎', color:'#D97706'};
  if(nm.includes('이메일') || nm.includes('메일')) return {icon:'📧', color:'#2563EB'};
  return {icon:'📌', color:'#888888'};
}

// ── 렌더링 ──
window.onload = function() {
  renderMainGrid();
  renderAdminList();
  showToast('프롬프트 라이브러리가 로드되었습니다.');
};

function renderMainGrid() {
  var grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  Object.keys(data_json).forEach(function(cat) {
    var s = getCatStyle(cat);
    var cnt = Array.isArray(data_json[cat]) ? data_json[cat].length : 0;
    var cntText = cnt > 0 ? '프롬프트 <b>' + cnt + '</b>개' : '바로가기 링크';
    var card = document.createElement('div');
    card.className = 'cat-card';
    card.style.setProperty('--cc', s.color);
    card.onclick = function(){ showCat(cat); };
    card.innerHTML = '<span class="cat-icon">' + s.icon + '</span><div class="cat-name">' + escHtml(cat) + '</div><div class="cat-cnt">' + cntText + '</div>';
    grid.appendChild(card);
  });
}

function showCat(cat) {
  document.getElementById('v-main').classList.remove('act');
  document.getElementById('v-admin').classList.remove('act');
  document.getElementById('v-cat').classList.add('act');
  document.getElementById('cat-hdr-title').innerText = cat;
  var wrap = document.getElementById('cat-wrap');
  wrap.innerHTML = '';
  var prompts = data_json[cat];
  if (!Array.isArray(prompts)) { wrap.innerHTML = '<p style="padding:20px;color:var(--muted)">데이터 형식 오류</p>'; return; }
  document.getElementById('cat-hdr-cnt').innerText = '프롬프트 ' + prompts.length + '개';
  var s = getCatStyle(cat);
  wrap.innerHTML = '<div class="ai-links-sec"><div class="sec-label">관련 AI 도구</div><div class="ai-links"><a class="ai-link" href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini</a><a class="ai-link" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a><a class="ai-link" href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a></div></div>';
  prompts.forEach(function(p, idx) {
    var sec = document.createElement('div');
    sec.className = 'p-section';
    sec.innerHTML = '<div class="p-sec-title"><span class="p-sec-bar" style="background:' + s.color + '"></span>' + escHtml(p.name) + '</div>'
      + '<div class="p-card"><div class="p-body"><div class="p-text" id="pt-' + idx + '">' + escHtml(p.content) + '</div></div>'
      + '<div class="p-foot"><button class="copy-btn" id="cb-' + idx + '" onclick="copyP(' + idx + ', this)"><span class="ic"></span> 복사</button></div></div>';
    wrap.appendChild(sec);
  });
  window._curCat = cat;
}

function copyP(idx, btn) {
  var el = document.getElementById('pt-' + idx);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText).then(function(){
    btn.classList.add('ok');
    showToast('복사되었습니다!');
    setTimeout(function(){ btn.classList.remove('ok'); }, 2000);
  }).catch(function(){
    var ta = document.createElement('textarea');
    ta.value = el.innerText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('ok');
    showToast('복사되었습니다!');
    setTimeout(function(){ btn.classList.remove('ok'); }, 2000);
  });
}

function showMain() {
  document.getElementById('v-cat').classList.remove('act');
  document.getElementById('v-admin').classList.remove('act');
  document.getElementById('v-main').classList.add('act');
}

// ── 검색 ──
function onSearch(q) {
  var res = document.getElementById('search-results');
  q = q.trim();
  if (!q) { res.style.display = 'none'; res.innerHTML = ''; return; }
  var matches = [];
  Object.keys(data_json).forEach(function(cat) {
    if (!Array.isArray(data_json[cat])) return;
    data_json[cat].forEach(function(p) {
      if ((p.name && p.name.includes(q)) || (p.content && p.content.includes(q))) {
        matches.push({cat: cat, name: p.name, content: p.content});
      }
    });
  });
  if (matches.length === 0) {
    res.style.display = 'block';
    res.innerHTML = '<div class="sr-item" style="color:var(--muted)">검색 결과가 없습니다.</div>';
    return;
  }
  res.style.display = 'block';
  res.innerHTML = matches.slice(0, 20).map(function(m) {
    return '<div class="sr-item" onclick="goSearch(\'' + escHtml(m.cat).replace(/'/g,"&#39;") + '\')">'
      + '<div class="sr-cat">' + escHtml(m.cat) + '</div>'
      + '<div class="sr-name">' + escHtml(m.name) + '</div>'
      + '<div class="sr-preview">' + escHtml((m.content||'').substring(0,60)) + '...</div>'
      + '</div>';
  }).join('');
}

function goSearch(cat) {
  document.getElementById('search-results').style.display = 'none';
  document.getElementById('search-input').value = '';
  showCat(cat);
}

// ── 관리자 ──
function openPwModal() {
  document.getElementById('mb-pw').classList.add('open');
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-err').innerText = '';
  setTimeout(function(){ document.getElementById('pw-input').focus(); }, 100);
}
function closePwModal() { document.getElementById('mb-pw').classList.remove('open'); }
function pwErr(m) { document.getElementById('pw-err').innerText = m; }
function checkPw() {
  if (document.getElementById('pw-input').value === adminPassword) {
    closePwModal();
    showAdmin();
  } else {
    pwErr('비밀번호가 틀렸습니다.');
  }
}
function showAdmin() {
  document.getElementById('v-main').classList.remove('act');
  document.getElementById('v-cat').classList.remove('act');
  document.getElementById('v-admin').classList.add('act');
  renderAdminList();
}

function renderAdminList() {
  var list = document.getElementById('a-cat-list');
  if (!list) return;
  list.innerHTML = '';
  Object.keys(data_json).forEach(function(cat) {
    var prompts = Array.isArray(data_json[cat]) ? data_json[cat] : [];
    var item = document.createElement('div');
    item.className = 'a-cat-item';
    item.innerHTML = '<div class="a-cat-h" onclick="toggleCatList(this)">'
      + '<span class="a-cat-nm">' + escHtml(cat) + ' (' + prompts.length + ')</span>'
      + '<div class="a-cat-actions">'
      + '<button class="btn btn-p btn-sm" onclick="event.stopPropagation();showAddPromptForm(\'' + esc(cat) + '\')" style="display:none" data-add>+ 프롬프트 추가</button>'
      + '<button class="btn btn-d btn-sm" onclick="event.stopPropagation();delCat(\'' + esc(cat) + '\')">삭제</button>'
      + '</div></div>'
      + '<div class="a-prompt-list" id="apl-' + safeId(cat) + '">'
      + '<div class="add-prompt-form" id="apf-' + safeId(cat) + '">'
      + '<div class="inline-form-title">새 프롬프트 추가</div>'
      + '<div class="fg"><label>프롬프트 제목</label><input class="fi" id="apf-nm-' + safeId(cat) + '" placeholder="제목"></div>'
      + '<div class="fg"><label>프롬프트 내용</label><textarea class="fi" id="apf-ct-' + safeId(cat) + '" placeholder="프롬프트 내용"></textarea></div>'
      + '<div class="fr"><button class="btn btn-p btn-sm" onclick="addPrompt(\'' + esc(cat) + '\')">추가</button>'
      + '<button class="btn btn-sm" onclick="hideAddPromptForm(\'' + esc(cat) + '\')">취소</button></div>'
      + '</div>'
      + prompts.map(function(p, i) {
        return '<div class="a-p-item" id="api-' + safeId(cat) + '-' + i + '">'
          + '<div class="a-p-info"><div class="a-p-nm">' + escHtml(p.name) + '</div>'
          + '<div class="a-p-pre">' + escHtml((p.content||'').substring(0,50)) + '...</div></div>'
          + '<div class="a-p-acts">'
          + '<button class="btn btn-w btn-sm" onclick="startEditPrompt(\'' + esc(cat) + '\',' + i + ')">편집</button>'
          + '<button class="btn btn-d btn-sm" onclick="delPrompt(\'' + esc(cat) + '\',' + i + ')">삭제</button>'
          + '</div></div>';
      }).join('')
      + '</div>';
    list.appendChild(item);
  });
}

function toggleCatList(el) {
  var apl = el.nextElementSibling;
  var addBtn = el.querySelector('[data-add]');
  if (apl.style.display === 'block') {
    apl.style.display = 'none';
    if(addBtn) addBtn.style.display = 'none';
  } else {
    apl.style.display = 'block';
    if(addBtn) addBtn.style.display = '';
  }
}

function toggleAddCatForm() {
  var f = document.getElementById('add-cat-form');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

function addCategory() {
  var nm = document.getElementById('new-cat-name').value.trim();
  if (!nm) { showToast('카테고리 이름을 입력하세요.'); return; }
  if (data_json[nm]) { showToast('이미 존재하는 카테고리입니다.'); return; }
  data_json[nm] = [];
  document.getElementById('new-cat-name').value = '';
  toggleAddCatForm();
  renderMainGrid();
  renderAdminList();
  showToast('카테고리가 추가되었습니다.');
}

function delCat(cat) {
  showConfirm('카테고리를 삭제할까요?', '"' + cat + '" 카테고리와 모든 프롬프트가 삭제됩니다.', function() {
    delete data_json[cat];
    renderMainGrid();
    renderAdminList();
    showToast('삭제되었습니다.');
  });
}

function showAddPromptForm(cat) {
  var f = document.getElementById('apf-' + safeId(cat));
  if(f) f.style.display = f.style.display === 'block' ? 'none' : 'block';
}

function hideAddPromptForm(cat) {
  var f = document.getElementById('apf-' + safeId(cat));
  if(f) f.style.display = 'none';
}

function addPrompt(cat) {
  var nm = document.getElementById('apf-nm-' + safeId(cat)).value.trim();
  var ct = document.getElementById('apf-ct-' + safeId(cat)).value.trim();
  if (!nm || !ct) { showToast('제목과 내용을 모두 입력하세요.'); return; }
  if (!Array.isArray(data_json[cat])) data_json[cat] = [];
  data_json[cat].push({name: nm, content: ct});
  renderMainGrid();
  renderAdminList();
  showToast('프롬프트가 추가되었습니다.');
}

function delPrompt(cat, idx) {
  showConfirm('프롬프트를 삭제할까요?', '삭제 후 복구할 수 없습니다.', function() {
    data_json[cat].splice(idx, 1);
    renderMainGrid();
    renderAdminList();
    showToast('삭제되었습니다.');
  });
}

function startEditPrompt(cat, idx) {
  var p = data_json[cat][idx];
  var itemEl = document.getElementById('api-' + safeId(cat) + '-' + idx);
  if (!itemEl) return;
  itemEl.innerHTML = '<div class="inline-form" style="flex:1">'
    + '<div class="inline-form-title">프롬프트 편집</div>'
    + '<div class="fg"><label>제목</label><input class="fi" id="ed-nm-' + idx + '" value="' + escAttr(p.name) + '"></div>'
    + '<div class="fg"><label>내용</label><textarea class="fi" id="ed-ct-' + idx + '">' + escHtml(p.content) + '</textarea></div>'
    + '<div class="fr"><button class="btn btn-p btn-sm" onclick="saveEditPrompt(\'' + esc(cat) + '\',' + idx + ')">저장</button>'
    + '<button class="btn btn-sm" onclick="renderAdminList()">취소</button></div>'
    + '</div>';
}

function saveEditPrompt(cat, idx) {
  var nm = document.getElementById('ed-nm-' + idx).value.trim();
  var ct = document.getElementById('ed-ct-' + idx).value.trim();
  if (!nm || !ct) { showToast('제목과 내용을 입력하세요.'); return; }
  data_json[cat][idx] = {name: nm, content: ct};
  renderMainGrid();
  renderAdminList();
  showToast('수정되었습니다.');
}

function changePw() {
  var cur = document.getElementById('pw-cur').value;
  var n1 = document.getElementById('pw-new1').value;
  var n2 = document.getElementById('pw-new2').value;
  if (cur !== adminPassword) { showToast('현재 비밀번호가 틀렸습니다.'); return; }
  if (!n1) { showToast('새 비밀번호를 입력하세요.'); return; }
  if (n1 !== n2) { showToast('새 비밀번호가 일치하지 않습니다.'); return; }
  adminPassword = n1;
  showToast('비밀번호가 변경되었습니다.');
}

// ── HTML 저장 ──
function saveHtml() {
  var html = document.documentElement.outerHTML;
  var escaped = JSON.stringify(data_json);
  var updated = html.replace(/var data_json = \{[\s\S]*?\};/, 'var data_json = ' + escaped + ';');
  var pwEscaped = adminPassword.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  updated = updated.replace(/var adminPassword = "[^"]*";/, 'var adminPassword = "' + pwEscaped + '";');
  var blob = new Blob([updated], {type: 'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MiCo Group AI 프롬프트 라이브러리.html';
  a.click();
  showToast('HTML 파일이 저장되었습니다.');
}

// ── 확인 모달 ──
var _confirmCb = null;
function showConfirm(title, msg, cb) {
  document.getElementById('confirm-title').innerText = title;
  document.getElementById('confirm-msg').innerText = msg;
  _confirmCb = cb;
  document.getElementById('mb-confirm').classList.add('open');
  document.getElementById('confirm-ok').onclick = function() { closeConfirm(); if(_confirmCb) _confirmCb(); };
}
function closeConfirm() { document.getElementById('mb-confirm').classList.remove('open'); }

// ── 토스트 ──
function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ── 유틸 ──
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return escHtml(s); }
function esc(s) { return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function safeId(s) { return String(s||'').replace(/[^a-zA-Z0-9가-힣]/g,'_'); }
</script>
